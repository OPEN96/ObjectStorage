name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test
        run: >
          dotnet test --configuration Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  smoke:
    name: Protocol smoke test
    runs-on: ubuntu-latest
    needs: build-test
    env:
      ASPNETCORE_ENVIRONMENT: Production
      S3STORAGE_Admin__Token: ci-admin-token-0123456789abcdef
      S3STORAGE_Storage__RootPath: ${{ runner.temp }}/s3data
      S3STORAGE_Storage__BootstrapAccessKeys__0__AccessKeyId: AKIACILOCAL00000001
      S3STORAGE_Storage__BootstrapAccessKeys__0__SecretAccessKey: ci-secret-0123456789abcdef0123456789
      S3STORAGE_Storage__BootstrapAccessKeys__0__DisplayName: ci
      S3STORAGE_Storage__BootstrapAccessKeys__0__IsAdmin: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish src/S3ObjectStorage.Api/S3ObjectStorage.Api.csproj -c Release -o ./publish

      - name: Start server
        run: |
          nohup dotnet ./publish/S3ObjectStorage.Api.dll > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              echo "server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become ready"
          cat server.log
          exit 1

      - name: Run independent SigV4 smoke test
        run: >
          python3 scripts/smoke.py
          --access-key AKIACILOCAL00000001
          --secret ci-secret-0123456789abcdef0123456789

      - name: Show server log on failure
        if: failure()
        run: cat server.log

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: s3objectstorage:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

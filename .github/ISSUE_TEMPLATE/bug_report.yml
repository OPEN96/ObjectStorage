name: Bug report
description: 报告一个可复现的缺陷
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索是否已有相同 Issue。
        **安全问题请勿在此公开，改用 Security → Report a vulnerability。**
  - type: textarea
    id: description
    attributes:
      label: 现象描述
      description: 发生了什么？期望的行为是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 尽量给出最小可复现命令或代码。
      placeholder: |
        1. 启动服务 dotnet run ...
        2. 执行 aws --endpoint-url ... s3 cp ...
        3. 观察到 ...
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: 使用的客户端
      multiple: true
      options:
        - aws cli
        - mc (MinIO Client)
        - minio-py
        - AWS SDK (.NET / Java / Node / Go)
        - 管理端网页
        - curl / 自研客户端
  - type: input
    id: version
    attributes:
      label: 版本 / commit
      placeholder: "v0.1.0 或 commit sha"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - dotnet run（Development）
        - dotnet publish + systemd
        - Docker / docker compose
        - 其它
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 请附上服务端日志与 `x-amz-request-id`，并脱敏密钥。
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue
          required: true
        - label: 我已移除日志中的密钥等敏感信息
          required: true

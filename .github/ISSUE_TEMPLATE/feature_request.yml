name: Feature request
description: 提出新功能或兼容性改进
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你遇到的具体场景是什么？不要只写「支持 X」。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望 API/配置/行为如何变化？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过哪些替代做法？
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - S3 数据面
        - SigV4 / 鉴权
        - 分片上传
        - 网页管理端
        - 部署 / 容器
        - 文档
        - 性能
  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现该功能
